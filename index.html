<!doctype html>
<html lang="pt-BR" data-theme="pixel">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f1e3">
  <meta name="color-scheme" content="only light">
  <title>Mapa de Estudos</title>
  <link rel="stylesheet" href="./estilos.css">
  <script defer src="./temas.js"></script>
  <script defer src="./motor.js"></script>
  <script defer src="./catalogo.js"></script>
  <script defer src="./painel.js"></script>
  <script defer src="./conquistas.js"></script>
  <script defer src="./trofeus.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="shell masthead-inner">
      <a class="brand" href="#/" aria-label="Mapa de Estudos, página inicial">
        <img src="./arte/mochila.png" alt="" width="32" height="32">
        <span class="classic-brand" aria-hidden="true">M</span>
        <span class="voxel-brand" aria-hidden="true"></span>
        <span>Mapa de Estudos</span>
      </a>
      <div class="masthead-actions">
        <a class="back-link" id="home" href="#/" hidden>← Avaliações</a>
        <label class="theme-picker" hidden>
          <span>Tema</span>
          <select id="theme-select"></select>
        </label>
      </div>
    </div>
  </header>
  <main class="shell" id="app" aria-busy="true"><p>Carregando avaliações…</p></main>
  <div id="notice" class="notice shell" role="status" hidden></div>
</body>
</html>
